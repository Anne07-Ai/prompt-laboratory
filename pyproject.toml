[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-laboratory"
version = "0.8.0"
description = "Git-native prompt definition, validation, and evaluation platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Lakshmi Anne" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
openai = ["openai>=1.40,<3"]
anthropic = ["anthropic>=0.34,<1"]
providers = [
  "openai>=1.40,<3",
  "anthropic>=0.34,<1",
]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]
dashboard = ["streamlit>=1.38,<2", "pandas>=2.2,<3", "plotly>=5.24,<7"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
prompt-lab = "prompt_laboratory.cli:main"
prompt-lab-api = "prompt_laboratory.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_laboratory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
