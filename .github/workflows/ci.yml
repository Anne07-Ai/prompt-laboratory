name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest
      - name: Phase 2 CLI smoke evaluation
        run: |
          prompt-lab evaluate \
            --prompt prompts/education/concept-explanation.yaml \
            --dataset datasets/education/concept-explanation.yaml \
            --output reports/education.json
          python -m json.tool reports/education.json > /dev/null
