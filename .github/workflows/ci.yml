name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts dashboard
      - name: Test
        run: python -m pytest
      - name: Build API container
        run: docker build -t prompt-laboratory-api:test .
      - name: Build dashboard container
        run: docker build -f Dockerfile.dashboard -t prompt-laboratory-dashboard:test .
      - name: Phase 2 CLI smoke evaluation
        run: |
          prompt-lab evaluate \
            --prompt prompts/education/concept-explanation.yaml \
            --dataset datasets/education/concept-explanation.yaml \
            --output reports/education.json
          python -m json.tool reports/education.json > /dev/null

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      PROMPT_LAB_AUTH_SECRET: ci-compose-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - name: Start Docker Compose stack
        run: docker compose up --build --wait --wait-timeout 120
      - name: Verify authenticated application flow
        run: python scripts/smoke_compose.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
