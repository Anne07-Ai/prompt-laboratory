name: prompt-quality-gate

on:
  push:
    branches: [main]
    paths:
      - "prompts/**"
      - "datasets/**"
      - "baselines/**"
      - "configs/regression-policy.yaml"
      - "src/prompt_laboratory/**"
      - "scripts/evaluate_repository.py"
      - ".github/workflows/prompt-evaluation.yml"
  pull_request:
    paths:
      - "prompts/**"
      - "datasets/**"
      - "baselines/**"
      - "configs/regression-policy.yaml"
      - "src/prompt_laboratory/**"
      - "scripts/evaluate_repository.py"
      - ".github/workflows/prompt-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run repository prompt gate
        run: |
          python scripts/evaluate_repository.py \
            --output reports/ci \
            --policy configs/regression-policy.yaml \
            --baseline baselines/mock-baseline.json
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-evaluation-${{ github.run_id }}
          path: reports/ci/
          if-no-files-found: error
          retention-days: 14
