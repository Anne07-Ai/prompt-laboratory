services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prompt_lab
      POSTGRES_USER: prompt_lab
      POSTGRES_PASSWORD: prompt_lab_local
    volumes:
      - prompt_lab_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompt_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://prompt_lab:prompt_lab_local@postgres:5432/prompt_lab
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      PROMPT_LAB_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  prompt_lab_data:
